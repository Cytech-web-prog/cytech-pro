<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyTech Pro - Trivia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        #level-title { font-size: 18px; color: #cbd5e1; margin-bottom: 20px; font-weight: bold; }
        #question-text { font-size: 20px; margin-bottom: 25px; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        button.option-btn { background: #334155; color: white; border: 2px solid #475569; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; }
        button.option-btn:hover { background: #3b82f6; border-color: #60a5fa; }
        #next-btn { background: #10b981; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 25px; display: none; width: 100%; font-weight: bold; }
        #next-btn:hover { background: #059669; }
        #score-box { font-size: 16px; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CyTech Pro</h1>
        <div id="level-title">Cargando nivel...</div>
        
        <div id="quiz-box">
            <p id="question-text">Cargando preguntas...</p>
            <div class="options-grid" id="options-container"></div>
        </div>

        <button id="next-btn" onclick="nextQuestion()">Siguiente Pregunta</button>
        <div id="score-box"></div>
    </div>

    <script src="questions.js"></script>
    <script>
        const levels = [
            { key: 'redes', name: 'Nivel 1: Redes y Protocolos' },
            { key: 'programacion', name: 'Nivel 2: Programación y Desarrollo' },
            { key: 'baseDeDatos', name: 'Nivel 3: Bases de Datos' },
            { key: 'linux', name: 'Nivel 4: Linux y Comandos' },
            { key: 'softwareLibre', name: 'Nivel 5: Software Libre y Cultura' }
        ];

        let currentLevelIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;
        let currentQuestions = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof categoriesData !== 'undefined') {
                loadLevel();
            } else {
                document.getElementById('question-text').innerText = "Error: No se encontró categoriesData en questions.js.";
            }
        });

        function loadLevel() {
            if (currentLevelIndex < levels.length) {
                const levelInfo = levels[currentLevelIndex];
                currentQuestions = categoriesData[levelInfo.key];
                currentQuestionIndex = 0;
                document.getElementById('level-title').innerText = levelInfo.name;
                showQuestion();
            } else {
                document.getElementById('level-title').innerText = "¡Juego Completado!";
                document.getElementById('question-text').innerText = `¡Felicidades! Has completado todos los niveles de CyTech Pro con éxito.\nPuntaje total: ${score} / ${levels.length * 20}`;
                document.getElementById('options-container').innerHTML = '';
                document.getElementById('next-btn').style.display = 'none';
            }
        }

        function showQuestion() {
            document.getElementById('next-btn').style.display = 'none';
            if (currentQuestionIndex < currentQuestions.length) {
                const q = currentQuestions[currentQuestionIndex];
                document.getElementById('question-text').innerText = `(${currentQuestionIndex + 1}/20) ${q.question}`;
                
                const optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';
                
                q.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = option;
                    btn.onclick = () => selectAnswer(btn, option, q.correct);
                    optionsContainer.appendChild(btn);
                });
                
                document.getElementById('score-box').innerText = `Puntaje acumulado: ${score}`;
            } else {
                // Pasó las 20 preguntas del nivel actual
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    alert(`¡Excelente! Has superado el ${levels[currentLevelIndex - 1].name}. ¡Pasamos al siguiente nivel!`);
                    loadLevel();
                } else {
                    loadLevel();
                }
            }
        }

        function selectAnswer(button, selected, correct) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correct) {
                    btn.style.background = '#059669'; // Verde acierto
                } else if (btn === button && selected !== correct) {
                    btn.style.background = '#dc2626'; // Rojo error
                }
            });

            if (selected === correct) {
                score++;
            }
            
            document.getElementById('score-box').innerText = `Puntaje acumulado: ${score}`;
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }
    </script>
</body>
</html>
