<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyTech Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1, h2 { color: #58a6ff; margin-bottom: 15px; text-align: center; }
        p { margin-bottom: 20px; line-height: 1.5; text-align: center; }
        .btn { display: block; width: 100%; background: #238636; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; transition: background 0.2s; }
        .btn:hover { background: #2ea043; }
        .option-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; margin-top: 10px; text-align: left; padding: 12px 15px; }
        .option-btn:hover { background: #30363d; border-color: #8b949e; }
        #stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 14px; background: #21262d; padding: 10px; border-radius: 6px; border: 1px solid #30363d; }
    </style>
</head>
<body>

    <div class="container" id="welcome-screen">
        <h1>CYTECH PRO</h1>
        <p>Bienvenida a la plataforma interactiva de trivia tecnológica. Pon a prueba tus conocimientos en redes, programación, bases de datos, Linux y cultura libre.</p>
        <button class="btn" onclick="startChallenge()">Iniciar Estaciones</button>
    </div>

    <div class="container" id="challenge-screen" style="display: none;">
        <div id="stats-bar">
            <span id="score-display">Puntos: 0</span>
            <span id="streak-display">🔥 Racha: 0</span>
            <span id="hearts-display">❤️❤️❤️</span>
        </div>
        <h2 id="level-title">Estación</h2>
        <p id="question-text" style="font-size: 18px; font-weight: 500; margin-bottom: 25px; text-align: left;"></p>
        <div id="options-container"></div>
    </div>

    <div class="container" id="game-screen" style="display: none;">
        <h2>¡Estación Superada!</h2>
        <p id="game-screen-text">Has completado los retos con éxito.</p>
        <button class="btn" onclick="location.reload()">Volver al Inicio</button>
    </div>

    <!-- Archivo externo de preguntas -->
    <script src="questions.js"></script>

    <!-- Motor del juego -->
    <script>
        let currentLevelIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;
        let fails = 0;
        let lives = 3;
        let currentQuestions = [];

        function speakAlertText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startChallenge() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('challenge-screen').style.display = 'block';
            loadLevel();
        }

        function loadLevel() {
            if (typeof levels === 'undefined' || !levels[currentLevelIndex]) {
                document.getElementById('challenge-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                return;
            }
            let levelInfo = levels[currentLevelIndex];
            document.getElementById('level-title').innerText = levelInfo.name;
            currentQuestions = [...levelInfo.questions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                currentLevelIndex++;
                loadLevel();
                return;
            }
            let q = currentQuestions[currentQuestionIndex];
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.question}`;
            
            let optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            shuffledOptions.forEach(option => {
                let btn = document.createElement('button');
                btn.className = 'btn option-btn';
                btn.innerText = option;
                btn.onclick = () => selectAnswer(btn, option, q.answer);
                optionsContainer.appendChild(btn);
            });
            updateStatsUI();
        }

        function selectAnswer(button, selected, correct) {
            let allBtns = document.querySelectorAll('#options-container .option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                button.style.background = '#238636';
                score += 10;
                speakAlertText("¡Correcto!");
            } else {
                button.style.background = '#da3633';
                lives--;
                speakAlertText("Incorrecto");
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.style.background = '#238636';
                });
            }

            updateStatsUI();

            if (lives <= 0) {
                speakAlertText("Juego terminado. Te has quedado sin vidas.");
                setTimeout(() => {
                    alert("¡Juego terminado! Te has quedado sin vidas.");
                    location.reload();
                }, 1500);
                return;
            }

            setTimeout(() => {
                currentQuestionIndex++;
                showQuestion();
            }, 1200);
        }

        function updateStatsUI() {
            document.getElementById('score-display').innerText = `Puntos: ${score}`;
            document.getElementById('streak-display').innerText = `🔥 Racha: ${Math.floor(score / 20)}`;
            let heartsStr = '';
            for (let i = 0; i < lives; i++) heartsStr += '❤️';
            document.getElementById('hearts-display').innerText = heartsStr;
        }
    </script>
</body>
</html>
