<style>
:root{--bg:#0b0f19;--card:#131b2e;--ac:#238636;--tx:#c9d1d9;--gold:#f1e05a;--blue:#58a6ff;--bd:#30363d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:10px;display:flex;justify-content:center}
.box{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--bd);box-sizing:border-box}
.stats{display:flex;justify-content:space-around;background:#1a233a;padding:10px;border-radius:10px;margin-bottom:16px;font-size:.85rem;font-weight:bold;border:1px solid var(--bd)}
h2{font-size:1.1rem;color:var(--blue);text-align:center;margin:0 0 12px}
.screen{display:none}.screen.on{display:block}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0}
.node{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--bd);background:#161b22;color:#484f58;font-size:.65rem;text-align:center;cursor:not-allowed}
.node b{font-size:1.5rem}
.node.cur{background:#1f6feb;border-color:var(--blue);color:#fff;cursor:pointer;animation:p 1.6s infinite}
.node.ok{background:var(--ac);border-color:#2ea043;color:#fff;cursor:pointer}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(88,166,255,.2)}}
.btn{width:100%;background:linear-gradient(135deg,#238636,#2ea043);color:#fff;border:0;padding:12px;border-radius:10px;font-weight:bold;font-size:.95rem;margin-top:10px;cursor:pointer}
.btn.sec{background:#21262d;border:1px solid var(--bd);color:var(--tx)}
.btn:disabled{opacity:.4}
.bar{height:10px;background:#21262d;border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:.9rem}
.q{font-size:1.05rem;line-height:1.4;margin-bottom:16px}
.opt{width:100%;background:#21262d;color:var(--tx);border:1px solid var(--bd);padding:12px;margin-bottom:9px;border-radius:8px;text-align:left;font-size:.95rem;cursor:pointer}
.opt.good{background:#238636;border-color:#2ea043;color:#fff}
.opt.bad{background:#da3633;border-color:#f85149;color:#fff}
.opt.off{opacity:.25}
.fb{display:none;margin-top:10px;padding:12px;border-radius:10px;font-size:.9rem;line-height:1.4}
.fb.good{display:block;background:#12301c;border:1px solid #2ea043}
.fb.bad{display:block;background:#3a1618;border:1px solid #f85149}
.row{display:flex;justify-content:space-between;align-items:center;background:#161b22;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.trophy{background:#161b22;border:2px solid var(--gold);border-radius:12px;padding:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f6feb;color:#fff;padding:10px 16px;border-radius:20px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
</style></head><body>

const $=id=>document.getElementById(id);
let S={xp:6301,bits:170,streak:1,last:"",done:0,hints:0,extra:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('cytech3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cytech3',JSON.stringify(S))}catch(e){}};
const today=new Date().toDateString();
if(S.last!==today){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=today;save()}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';speechSynthesis.speak(u)}catch(e){}}
function toast(t){const e=$('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function stats(){$('st').innerText=S.streak;$('xp').innerText=S.xp;$('bt').innerText=S.bits}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');
 if(id=='map')map();if(id=='lb')board();if(id=='store')$('inv').innerText=`Tienes: ${S.extra} vidas extra · ${S.hints} pistas`;stats()}
function map(){const p=$('path');p.innerHTML='';U.forEach((u,i)=>{const n=document.createElement('div');
 n.className='node '+(i<S.done?'ok':i==S.done?'cur':'');n.style.transform=`translateX(${i%2?40:-40}px)`;
 n.innerHTML=i<=S.done?`<b>${i<S.done?'✓':u.i}</b>${u.n}`:`<b>🔒</b>${u.n}`;if(i<=S.done)n.onclick=()=>start(i);p.appendChild(n)})}
let L;
function start(u){L={u,qs:shuf(U[u].q).map(x=>({q:x.q,a:x.o[x.a],o:x.o.some(t=>/^Ambas/.test(t))?x.o:shuf(x.o),e:x.e||''})),i:0,lives:3,ok:0,done:false};go('game');show()}
function hearts(){$('lv').innerText='❤️'.repeat(Math.max(L.lives,0))||'💔'}
function show(){const c=L.qs[L.i];L.done=false;L.used=false;hearts();$('ut').innerText=`${U[L.u].i} ${U[L.u].n}`;
 $('pb').style.width=(L.i/L.qs.length*100)+'\%';$('q').innerText=c.q;$('fb').className='fb';$('next').style.display='none';
 $('hint').style.display='block';$('hint').innerText=`💡 Pista 50/50 (${S.hints})`;
 const o=$('opts');o.innerHTML='';c.o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.innerText=t;b.onclick=()=>pick(b,t);o.appendChild(b)})}
function hint(){if(L.done||L.used)return;if(S.hints<1)return toast('No tienes pistas. Cómpralas en la tienda');
 S.hints--;L.used=true;save();$('hint').innerText=`💡 Pista 50/50 (${S.hints})`;
 const c=L.qs[L.i];shuf([...document.querySelectorAll('.opt')].filter(b=>b.innerText!==c.a)).slice(0,2).forEach(b=>{b.classList.add('off');b.disabled=true})}

function pick(b,t){
    if(L.done)return;
    L.done=true;
    const c=L.qs[L.i],f=$('fb');$('hint').style.display='none';
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.innerText===c.a)x.classList.add('good')});
    
    if(t===c.a){
        L.ok++;
        S.xp+=50;
        S.bits+=15;
        f.className='fb good';
        f.innerHTML=`✅ <b>¡Correcto!</b> ${c.e}`;
        say('¡Correcto!');
        try{confetti({particleCount:70,spread:60,origin:{y:.6}})}catch(e){}
    } else {
        b.classList.add('bad');
        L.lives--;
        if(L.lives<=0&&S.extra>0){S.extra--;L.lives=1;toast('Se usó una vida extra ❤️')}
        L.qs.push(c);
        f.className='fb bad';
        f.innerHTML=`❌ <b>Respuesta:</b> ${esc(c.a)}. ${c.e}<br><small>Volverá a aparecer al final.</small>`;
        say('Incorrecto');
    }
    save();
    stats();
    hearts();
    $('next').style.display='block';
}

function next(){
    if(L.lives<=0)return end(false);
    L.i++;
    if(L.i>=L.qs.length){
        end(true);
    } else {
        show();
    }
}

function end(win){
    go('res');
    if(!win){
        $('rt').innerText='💔 Te quedaste sin vidas';
        $('rb').innerHTML='<div style="font-size:46px">😵</div><p>No te rindas, ¡inténtalo de nuevo! Repasa y vuelve más fuerte.</p>';
        say('Te quedaste sin vidas');
        return;
    }
    S.xp+=100;
    S.bits+=30;
    const first=L.u===S.done;
    if(first)S.done++;
    save();
    stats();
    
    try{confetti({particleCount:250,spread:120,origin:{y:.4}})}catch(e){}

    if(S.done>=U.length){
        $('rt').innerText='🎉 ¡Misión Cumplida y Estación Legendaria!';
        $('rb').innerHTML=`<div style="font-size:50px">🏆</div><h3 style="color:var(--gold);margin:6px 0">Rango: Desarrollador Full-Stack Elite con Insignia de Oro</h3><p style="font-size:.9rem;line-height:1.4">¡Felicidades, Christ Ydrogo! Has completado las ${U.length} unidades y las 160 preguntas tecnológicas. Esta insignia certifica tu maestría técnica absoluta.</p>`;
        say('¡Felicidades, has completado todas las unidades y ganado la insignia de oro!');
    } else {
        $('rt').innerText='✅ ¡Lección completada!';
        $('rb').innerHTML=`<div style="font-size:46px">${U[L.u].i}</div><h3 style="color:var(--gold);margin:6px 0">${U[L.u].n}</h3><p>+XP ganada · ❤️ ${L.lives} vidas restantes<br>${first&&S.done<U.length?'¡Desbloqueaste la siguiente unidad!':''}</p>`;
        say('Lección completada con éxito');
    }
}

function board(){
    const l=[...RIV,["Christ Ydrogo",S.xp]].sort((a,b)=>b[1]-a[1]);
    $('lbl').innerHTML=l.map((r,i)=>`<div class="row" style="${r[0]=='Christ Ydrogo'?'color:var(--gold);font-weight:bold':''}"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${r[0]}</span><span>${r[1]} XP</span></div>`).join('');
}

function buy(k){
    const c=k=='vida'?50:30;
    if(S.bits<c)return toast('No tienes suficientes Bits');
    S.bits-=c;
    k=='vida'?S.extra++:S.hints++;
    save();
    stats();
    toast('¡Compra realizada!');
    go('store');
}

let rc=false;
function reset(){
    if(!rc){
        rc=true;
        $('rst').innerText='Toca de nuevo para confirmar';
        setTimeout(()=>{rc=false;$('rst').innerText='Reiniciar progreso'},3000);
        return;
    }
    S={xp:6301,bits:170,streak:1,last:today,done:0,hints:0,extra:0};
    save();
    rc=false;
    $('rst').innerText='Reiniciar progreso';
    go('map');
}

go('map');
